name: Docker Staging Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target build environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - qa
          - production

jobs:
  bundle-size-audit:
    name: Audit & Measure Bundle Size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Compile Staging Bundle with Rsbuild
        run: npm run build:staging

      - name: Measure Bundle Sizing & Output Step Summary
        run: npm run bundle:size

      - name: Upload Bundle Size JSON Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-report
          path: dist/bundle-size-report.json

  build-and-test:
    name: Build Docker Image (Rsbuild Staging)
    runs-on: ubuntu-latest
    needs: [bundle-size-audit]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            APP_ENV=${{ github.event.inputs.environment || 'staging' }}
          tags: project-base-rsbuild:${{ github.event.inputs.environment || 'staging' }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Smoke Test Container
        run: |
          docker run -d --name test-mfe -p 4200:80 project-base-rsbuild:${{ github.event.inputs.environment || 'staging' }}
          sleep 4
          curl -fsS http://localhost:4200/healthz
          echo "✓ Healthcheck /healthz passed"
          curl -fsS http://localhost:4200/ | head -n 5
          echo "✓ Root Host Shell passed"
          curl -fsS http://localhost:4200/crm/mf-manifest.json
          echo "✓ CRM Remote manifest passed"
          curl -fsS http://localhost:4200/cdp/mf-manifest.json
          echo "✓ CDP Remote manifest passed"
          docker rm -f test-mfe
