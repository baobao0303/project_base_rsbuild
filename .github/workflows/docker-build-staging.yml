name: Docker Staging Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target build environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - qa
          - production

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build, Publish & Audit Docker Image (GHCR)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Staging Docker Image with Rsbuild
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            APP_ENV=${{ github.event.inputs.environment || 'staging' }}
          tags: project-base-rsbuild:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Smoke Test Container
        run: |
          docker run -d --name test-mfe -p 4200:80 project-base-rsbuild:local
          sleep 4
          curl -fsS http://localhost:4200/healthz
          echo "✓ Healthcheck /healthz passed"
          curl -fsS http://localhost:4200/ | head -n 5
          echo "✓ Root Host Shell passed"
          curl -fsS http://localhost:4200/crm/mf-manifest.json
          echo "✓ CRM Remote manifest passed"
          curl -fsS http://localhost:4200/cdp/mf-manifest.json
          echo "✓ CDP Remote manifest passed"
          docker rm -f test-mfe

      - name: Publish Docker Image to GitHub Packages (GHCR)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          # Lowercase repository name for Docker registry standard
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          ENV_TAG="${{ github.event.inputs.environment || 'staging' }}"

          docker tag project-base-rsbuild:local ${IMAGE_NAME}:${ENV_TAG}
          docker tag project-base-rsbuild:local ${IMAGE_NAME}:latest

          echo "Pushing ${IMAGE_NAME}:${ENV_TAG} and :latest to GitHub Packages..."
          docker push ${IMAGE_NAME}:${ENV_TAG}
          docker push ${IMAGE_NAME}:latest
          echo "✓ Successfully published Docker package to GitHub Packages!"

      - name: Measure & Audit Bundle Size from Docker Output
        run: |
          mkdir -p dist
          docker create --name extract-container project-base-rsbuild:local
          docker cp extract-container:/usr/share/nginx/html/. dist/
          docker rm extract-container
          node scripts/bundle-size.mjs

      - name: Upload Bundle Size JSON Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-report
          path: dist/bundle-size-report.json
