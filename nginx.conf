server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/x-javascript text/javascript image/svg+xml;

    # Global CORS headers for Module Federation 2.0
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, HEAD' always;
    add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

    # Healthcheck endpoint
    location = /healthz {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Micro-Frontend 1: MFE CRM (/crm/)
    location /crm/ {
        alias /usr/share/nginx/html/crm/;
        try_files $uri $uri/ /crm/index.html;

        # Disable cache for manifest & remote entry
        location ~* (mf-manifest\.json|remoteEntry\.mjs)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Access-Control-Allow-Origin * always;
        }
    }

    # Micro-Frontend 2: MFE CDP (/cdp/)
    location /cdp/ {
        alias /usr/share/nginx/html/cdp/;
        try_files $uri $uri/ /cdp/index.html;

        # Disable cache for manifest & remote entry
        location ~* (mf-manifest\.json|remoteEntry\.mjs)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Access-Control-Allow-Origin * always;
        }
    }

    # Host Shell SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prevent caching of root mf-manifest.json
    location ~* (mf-manifest\.json|remoteEntry\.mjs)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin * always;
    }

    # Static assets long caching (hashed files)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        add_header Access-Control-Allow-Origin * always;
    }
}
